<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121211">
  <title>ASCII Depth – as a page background</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #121211; color: #ece7dc; font: 14px/1.5 "IBM Plex Mono", ui-monospace, monospace; }
    /* the background sits in a fixed layer behind everything */
    #bg { position: fixed; inset: 0; z-index: 0; }
    main {
      position: relative; z-index: 1;
      min-height: 100%;
      display: grid; align-content: start;
      padding: clamp(24px, 8vh, 96px) clamp(16px, 6vw, 80px);
    }
    h1 { margin: 0 0 8px; font-weight: 500; font-size: clamp(22px, 3.2vw, 36px); letter-spacing: -0.01em; }
    p { margin: 0; max-width: 38ch; color: #a8a398; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <main>
    <h1>Your headline here</h1>
    <p>The ASCII background running behind real content, with no controls. Copy this file as a starting point.</p>
  </main>

  <script src="src/noise.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/scenes/pnw.js"></script>
  <script>
    AsciiBG.create(document.getElementById('bg'), {
      scene: 'pnw',
      speed: 0.6,     // calmer behind text
      blur: 1,
      start: 40,      // skip ahead to a nice stretch of shoreline
    });
  </script>
</body>
</html>
